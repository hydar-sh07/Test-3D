<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Fly Brain SNN Lab</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js",
          "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/RenderPass.js",
          "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js"
        }
      }
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🧠 Drosophila Connectome Platform</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="lab.html" class="active">3D Lab</a></li>
            <li><a href="anatomy.html">Anatomy Guide</a></li>
            <li><a href="analytics.html">Analytics</a></li>
        </ul>
    </nav>

    <div id="fps-counter">FPS: <span id="fps-val">60</span></div>

    <div id="hud">
        <h2>🧠 SNN Bio-Connectome</h2>
        <div id="node-title">Spiking Neural Simulation ⚡</div>
        <div id="node-desc">Click any neuron node to inject voltage and fire real action potential cascade!</div>
        
        <div class="section-title">Lobe Filters 🔬</div>
        <div class="btn-group">
            <button class="filter-btn" data-lobe="All">Show All</button>
            <button class="filter-btn" data-lobe="Optic">Optic Lobes</button>
            <button class="filter-btn" data-lobe="Mushroom">Mushroom Bodies</button>
            <button class="filter-btn" data-lobe="Central">Central Complex</button>
        </div>

        <div class="section-title" style="margin-top: 10px;">Simulation Controls ⚡</div>
        <div class="btn-group">
            <button id="fire-all-btn">⚡ Stimulate All</button>
            <button id="bg-btn">🌌 Change BG</button>
            <button id="pulse-btn">⚡ Speed Pulse</button>
            <button id="reset-btn">🔄 Reset View</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
